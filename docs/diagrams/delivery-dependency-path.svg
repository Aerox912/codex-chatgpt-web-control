      <text x="150" y="32" text-anchor="middle" class="milestone">M0 — Bootstrap</text><text x="150" y="55" text-anchor="middle" class="small">NIC-378 · In Progress</text>

      <rect x="28" y="105" width="244" height="96" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="150" y="136" text-anchor="middle" class="issue">NIC-383 · In Progress</text><text x="150" y="159" text-anchor="middle" class="small">Repository exists</text><text x="150" y="180" text-anchor="middle" class="small">Merge pinned upstream history</text>
      <rect x="28" y="230" width="244" height="78" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="150" y="261" text-anchor="middle" class="issue">NIC-384 · Done</text><text x="150" y="284" text-anchor="middle" class="small">Overlay, locks, notices, docs</text>
      <rect x="28" y="337" width="244" height="96" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="368" text-anchor="middle" class="issue">NIC-385 · Todo</text><text x="150" y="391" text-anchor="middle" class="small">Capture unchanged Web and</text><text x="150" y="412" text-anchor="middle" class="small">visible-control baselines</text>
      <rect x="28" y="462" width="244" height="78" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="150" y="493" text-anchor="middle" class="issue">NIC-386 · Done</text><text x="150" y="516" text-anchor="middle" class="small">Lease contracts and proofs</text>
      <rect x="28" y="569" width="244" height="78" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="150" y="600" text-anchor="middle" class="issue">NIC-387 · Done</text><text x="150" y="623" text-anchor="middle" class="small">Lease manager and tests</text>
