      <rect x="28" y="426" width="244" height="96" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="457" text-anchor="middle" class="issue">NIC-393</text><text x="150" y="480" text-anchor="middle" class="small">Chat, Work, files, artifacts</text><text x="150" y="501" text-anchor="middle" class="small">plus restart evidence</text>
