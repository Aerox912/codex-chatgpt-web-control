<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Codex ChatGPT Web Control Delivery Dependency Path</title>
  <desc id="desc">Milestones M0 through M4 and the Linear issues that form the critical delivery path.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5e6c84"/></marker>
    <style>
      .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}.subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#5e6c84}.milestone{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}.issue{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}.small{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#42526e}.edge{fill:none;stroke:#5e6c84;stroke-width:2.5;marker-end:url(#arrow)}.critical{fill:none;stroke:#0052cc;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1700" height="980" rx="24" fill="#f7f8fa"/>
  <text x="850" y="55" text-anchor="middle" class="title">Delivery Dependency Path</text>
  <text x="850" y="85" text-anchor="middle" class="subtitle">Standalone project only — agent-system integration remains outside this roadmap.</text>

