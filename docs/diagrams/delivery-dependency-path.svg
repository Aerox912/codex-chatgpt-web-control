      <rect x="28" y="130" width="244" height="105" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="162" text-anchor="middle" class="issue">NIC-388 · Next</text><text x="150" y="185" text-anchor="middle" class="small">Wire beginTurn / endTurn</text><text x="150" y="206" text-anchor="middle" class="small">through compatibility façade</text>
      <rect x="28" y="285" width="244" height="105" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="317" text-anchor="middle" class="issue">NIC-389</text><text x="150" y="340" text-anchor="middle" class="small">Model-only and mixed-surface</text><text x="150" y="361" text-anchor="middle" class="small">isolation / capacity tests</text>
