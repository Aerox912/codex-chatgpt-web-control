      <rect x="28" y="105" width="244" height="78" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="136" text-anchor="middle" class="issue">NIC-390</text><text x="150" y="159" text-anchor="middle" class="small">Browser contract adapter</text>
