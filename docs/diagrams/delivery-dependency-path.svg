      <rect x="28" y="105" width="244" height="78" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="136" text-anchor="middle" class="issue">NIC-394</text><text x="150" y="159" text-anchor="middle" class="small">Global scheduler</text>
      <rect x="28" y="212" width="244" height="96" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="243" text-anchor="middle" class="issue">NIC-395</text><text x="150" y="266" text-anchor="middle" class="small">Account cooldown and</text><text x="150" y="287" text-anchor="middle" class="small">exclusive session operations</text>
      <rect x="28" y="337" width="244" height="78" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="368" text-anchor="middle" class="issue">NIC-396</text><text x="150" y="391" text-anchor="middle" class="small">Authenticated loopback API</text>
      <rect x="28" y="444" width="244" height="78" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="475" text-anchor="middle" class="issue">NIC-397</text><text x="150" y="498" text-anchor="middle" class="small">Worker crash isolation</text>
      <text x="150" y="604" text-anchor="middle" class="small">Exit: safe local service and</text><text x="150" y="625" text-anchor="middle" class="small">shared account coordination</text>
    </g>

    <g transform="translate(1300 0)">
      <rect x="0" y="0" width="300" height="745" rx="20" fill="#ffffff" stroke="#dfe1e6" stroke-width="2"/>
      <rect x="0" y="0" width="300" height="72" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
      <text x="150" y="32" text-anchor="middle" class="milestone">M4 — Product / RC</text><text x="150" y="55" text-anchor="middle" class="small">NIC-382 · Planned</text>
      <rect x="28" y="105" width="244" height="78" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="136" text-anchor="middle" class="issue">NIC-398</text><text x="150" y="159" text-anchor="middle" class="small">Unified launcher views</text>
      <rect x="28" y="212" width="244" height="96" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="150" y="243" text-anchor="middle" class="issue">NIC-399</text><text x="150" y="266" text-anchor="middle" class="small">Codex plugin and</text><text x="150" y="287" text-anchor="middle" class="small">Node / Python interfaces</text>
